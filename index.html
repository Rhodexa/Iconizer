<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iconizer</title>
  <meta name="description" content="Watermark a batch of pictures with an icon, entirely in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Iconizer</h1>
    <p class="sub">Watermark pictures with an icon. Everything runs in your browser — nothing is uploaded.</p>
  </header>

  <main>
    <aside class="panel">
      <section>
        <h2>1 · Icon</h2>
        <label class="drop" id="iconDrop">
          <input type="file" id="iconInput" accept="image/*" hidden>
          <img id="iconPreview" alt="" hidden>
          <span id="iconHint">Drop or choose an icon<br><small>PNG with transparency works best</small></span>
        </label>
      </section>

      <section>
        <h2>2 · Pictures</h2>
        <label class="drop" id="picsDrop">
          <input type="file" id="picsInput" accept="image/*" multiple hidden>
          <span>Drop or choose pictures<br><small id="picsCount">none loaded</small></span>
        </label>
        <button type="button" class="ghost" id="clearBtn" disabled>Clear pictures</button>
      </section>

      <section>
        <h2>3 · Placement</h2>
        <div class="field">
          <label for="position">Corner</label>
          <select id="position">
            <option value="auto" selected>Auto — best contrast</option>
            <option value="br">Bottom right</option>
            <option value="bl">Bottom left</option>
            <option value="tr">Top right</option>
            <option value="tl">Top left</option>
          </select>
        </div>
        <div class="field" id="autoCornersField">
          <span class="label">Corners allowed in auto</span>
          <div class="corners">
            <label><input type="checkbox" value="tl" checked> TL</label>
            <label><input type="checkbox" value="tr" checked> TR</label>
            <label><input type="checkbox" value="bl" checked> BL</label>
            <label><input type="checkbox" value="br" checked> BR</label>
          </div>
        </div>
        <div class="field">
          <label for="size">Size <output id="sizeOut"></output></label>
          <input type="range" id="size" min="3" max="60" value="30">
          <small>Icon width as % of the picture's shorter side</small>
        </div>
        <div class="field">
          <label for="margin">Margin <output id="marginOut"></output></label>
          <input type="range" id="margin" min="0" max="20" step="0.5" value="3">
        </div>
        <div class="field">
          <label for="opacity">Opacity <output id="opacityOut"></output></label>
          <input type="range" id="opacity" min="5" max="100" value="85">
        </div>
      </section>

      <section>
        <h2>4 · Export</h2>
        <div class="field">
          <label for="format">Format</label>
          <select id="format">
            <option value="same">Same as original</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
        <div class="field">
          <label for="quality">Quality <output id="qualityOut"></output></label>
          <input type="range" id="quality" min="50" max="100" value="92">
        </div>
        <button type="button" class="primary" id="downloadBtn" disabled>Download all (.zip)</button>
        <div class="progress" id="progress" hidden><div></div></div>
        <small id="status"></small>
      </section>
    </aside>

    <section class="gallery" id="gallery">
      <p class="empty" id="empty">Load an icon and some pictures to see previews here.</p>
    </section>
  </main>

  <script src="vendor/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
